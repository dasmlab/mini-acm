apiVersion: v1
kind: ServiceAccount
metadata:
  name: mini-mock-sa
  namespace: mini-mock-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: mini-mock-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: mini-mock-sa
    namespace: mini-mock-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-mock
  namespace: mini-mock-system
  labels:
    app: mini-mock
    app.kubernetes.io/name: mini-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-mock
  template:
    metadata:
      labels:
        app: mini-mock
    spec:
      serviceAccountName: mini-mock-sa
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: dasmlab-ghcr-pull
      containers:
        - name: mini-mock
          image: ghcr.io/dasmlab/mini-mock:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args:
            - serve
            - --listen
            - ":8080"
            - --data-dir
            - /data
          env:
            - name: DATA_DIR
              value: /data
            - name: LISTEN_ADDR
              value: ":8080"
            - name: BUILD_VERSION
              value: "__VERSION__"
            - name: APP_PUBLIC_URL
              value: "https://mini-mock.apps.2026-prod-1.ocp.dasmlab.org"
            - name: KEYCLOAK_URL
              value: "https://keycloak.apps.2026-prod-1.ocp.dasmlab.org"
            - name: KEYCLOAK_REALM
              value: dasmlab
            - name: OIDC_CLIENT_ID
              value: mini-mock
            # Create secret mini-mock-oidc with key client-secret to enable SSO
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mini-mock-oidc
                  key: client-secret
                  optional: false
            - name: OIDC_REDIRECT_URI
              value: "https://mini-mock.apps.2026-prod-1.ocp.dasmlab.org/api/v1/auth/callback"
            - name: OIDC_CA_FILE
              value: /etc/oidc/ca.crt
          volumeMounts:
            - name: mini-mock-data
              mountPath: /data
            - name: oidc-ca
              mountPath: /etc/oidc
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mini-mock-data
          persistentVolumeClaim:
            claimName: mini-mock-data
        - name: oidc-ca
          configMap:
            name: mini-mock-oidc-ca
            items:
              - key: ca.crt
                path: ca.crt
            optional: true

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mini-mock-data
  namespace: mini-mock-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mini-mock
  namespace: mini-mock-system
spec:
  selector:
    app: mini-mock
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mini-mock
  namespace: mini-mock-system
  labels:
    app: mini-mock
spec:
  host: mini-mock.apps.2026-prod-1.ocp.dasmlab.org
  to:
    kind: Service
    name: mini-mock
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
