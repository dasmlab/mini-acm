apiVersion: v1
kind: ServiceAccount
metadata:
  name: mock-me-sa
  namespace: mock-me-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: system:openshift:scc:anyuid
  namespace: mock-me-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: mock-me-sa
    namespace: mock-me-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-me
  namespace: mock-me-system
  labels:
    app: mock-me
    app.kubernetes.io/name: mock-me
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-me
  template:
    metadata:
      labels:
        app: mock-me
    spec:
      serviceAccountName: mock-me-sa
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      imagePullSecrets:
        - name: dasmlab-ghcr-pull
      containers:
        - name: mock-me
          image: ghcr.io/dasmlab/mock-me:__VERSION__
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          args:
            - serve
            - --listen
            - ":8080"
            - --data-dir
            - /data
          env:
            - name: DATA_DIR
              value: /data
            - name: LISTEN_ADDR
              value: ":8080"
            - name: BUILD_VERSION
              value: "__VERSION__"
            - name: APP_PUBLIC_URL
              value: "https://mock-me.apps.2026-prod-1.ocp.dasmlab.org"
            - name: KEYCLOAK_URL
              value: "https://keycloak.apps.2026-prod-1.ocp.dasmlab.org"
            - name: KEYCLOAK_REALM
              value: dasmlab
            - name: OIDC_CLIENT_ID
              value: mock-me
            # Create secret mock-me-oidc with key client-secret to enable SSO
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mock-me-oidc
                  key: client-secret
                  optional: false
            - name: OIDC_REDIRECT_URI
              value: "https://mock-me.apps.2026-prod-1.ocp.dasmlab.org/api/v1/auth/callback"
            - name: OIDC_CA_FILE
              value: /etc/oidc/ca.crt
            # Optional: oc create secret generic mock-me-ssh --from-file=id_ecdsa=... -n mock-me-system
            - name: INVENTORY_SSH_KEY
              value: /var/run/inventory-ssh/id_ecdsa
            # Optional: oc -n mock-me-system create secret generic mock-me-ocp-pull \
            #   --from-file=pull-secret.json=<(oc -n openshift-config get secret pull-secret -o jsonpath='{.data.\.dockerconfigjson}' | base64 -d)
            - name: PULL_SECRET_FILE
              value: /var/run/secrets/openshift/pull-secret
          volumeMounts:
            - name: mock-me-data
              mountPath: /data
            - name: oidc-ca
              mountPath: /etc/oidc
              readOnly: true
            - name: inventory-ssh
              mountPath: /var/run/inventory-ssh
              readOnly: true
            - name: ocp-pull-secret
              mountPath: /var/run/secrets/openshift
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: mock-me-data
          persistentVolumeClaim:
            claimName: mock-me-data
        - name: oidc-ca
          configMap:
            name: mock-me-oidc-ca
            items:
              - key: ca.crt
                path: ca.crt
            optional: true
        - name: inventory-ssh
          secret:
            secretName: mock-me-ssh
            defaultMode: 0440
            optional: true
        - name: ocp-pull-secret
          secret:
            secretName: mock-me-ocp-pull
            items:
              - key: pull-secret.json
                path: pull-secret
            optional: true

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mock-me-data
  namespace: mock-me-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: __STORAGE_CLASS__
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mock-me
  namespace: mock-me-system
spec:
  selector:
    app: mock-me
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mock-me
  namespace: mock-me-system
  labels:
    app: mock-me
spec:
  host: mock-me.apps.2026-prod-1.ocp.dasmlab.org
  to:
    kind: Service
    name: mock-me
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
