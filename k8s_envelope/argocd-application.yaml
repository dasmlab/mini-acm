apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-acm
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: mini-acm
    dasmlab.org/cluster: 2026-prod-1
spec:
  project: default
  source:
    repoURL: git@github.com:lmcdasm/dasmlab-live-cicd.git
    targetRevision: main
    path: clusters/2026-prod-1/mini-acm/live
    directory:
      recurse: false
      include: mini-acm-v*.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: mini-acm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
